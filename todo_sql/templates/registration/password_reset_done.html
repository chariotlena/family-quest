<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Письмо отправлено | Family Quest</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            text-align: center;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounce {
            0%   { transform: scale(0.5); opacity: 0; }
            70%  { transform: scale(1.15); }
            100% { transform: scale(1); opacity: 1; }
        }

        h2 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            font-size: 2.2em;
            margin-bottom: 15px;
        }

        p {
            color: #718096;
            font-size: 0.95em;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .hint {
            display: inline-block;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px 20px;
            font-size: 0.88em;
            color: #4a5568;
            margin-bottom: 30px;
        }

        .hint span {
            font-weight: 700;
            color: #667eea;
        }

        a.btn {
            display: inline-block;
            padding: 14px 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 14px;
            font-size: 1em;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        a.btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        /*Адаптация для мобильных устройств*/
        @media (max-width: 480px) {
            body { padding: 15px; }

            .container, .login-container, .signup-box {
                padding: 30px 20px;
                border-radius: 20px;
            }

            h2 { font-size: 1.8em; }
            p.subtitle, p { font-size: 0.9em; }

            form input[type="text"],
            form input[type="password"],
            form input[type="email"],
            form input {
                padding: 12px;
                font-size: 16px;
            }

            button {
                padding: 14px;
                font-size: 1em;
            }

            .form-section { padding: 15px; }
        }

    </style>
</head>
<body>

<div class="container">
    <h2>Проверьте почту!</h2>
    <p>Мы отправили инструкцию по восстановлению пароля на ваш Email.</p>
    <div class="hint">Не нашли письмо? Проверьте папку <span>«Спам»</span></div>
    <br>
    <a href="{% url 'login' %}" class="btn">← Вернуться ко входу</a>
</div>

</body>
</html>
