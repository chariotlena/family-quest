<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | Family Quest</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            font-size: 2.2em;
            margin-bottom: 10px;
        }

        p.subtitle {
            text-align: center;
            color: #718096;
            margin-bottom: 30px;
            font-size: 0.95em;
        }

        /* Ошибки Django */
        .errorlist {
            list-style: none;
            color: #f5576c;
            font-size: 0.85em;
            margin-bottom: 15px;
            padding: 10px;
            background: #fff5f5;
            border-radius: 10px;
            border-left: 4px solid #f5576c;
        }

        form p {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #4a5568;
            font-size: 0.9em;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e0;
            border-radius: 12px;
            font-size: 1em;
            transition: all 0.3s ease;
            background: #f8fafc;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            background: white;
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .extra-links {
            margin-top: 25px;
            text-align: center;
            font-size: 0.9em;
            color: #718096;
        }

        .extra-links a {
            color: #667eea;
            text-decoration: none;
            font-weight: 700;
            transition: color 0.3s;
        }

        .extra-links a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .forgot-password {
            display: block;
            margin-top: 15px;
            font-size: 0.85em;
            color: #a0aec0;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Вход</h2>
    <p class="subtitle">Рады видеть вас снова!</p>

    <form method="post">
        {% csrf_token %}

        {% if form.errors %}
            <div class="errorlist">
                Неверный логин или пароль. Попробуйте еще раз.
            </div>
        {% endif %}

        {{ form.as_p }}

        <button type="submit">Войти в квест</button>
    </form>

    <div class="extra-links">
        Нет аккаунта? <a href="{% url 'signup' %}">Зарегистрироваться</a>

        <a href="{% url 'password_reset' %}" class="forgot-password">Забыли пароль?</a>
    </div>
</div>

</body>
</html>
