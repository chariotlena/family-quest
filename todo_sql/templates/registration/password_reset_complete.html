{% extends 'base.html' %}

{% block title %}Вход | Family Quest{% endblock %}

{% block extra_styles %}
<style>
    body { align-items: center; } /* Выравниваем форму строго по центру */

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            text-align: center;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pop {
            0%   { transform: scale(0.3) rotate(-10deg); opacity: 0; }
            70%  { transform: scale(1.2) rotate(5deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        h2 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            font-size: 2.2em;
            margin-bottom: 15px;
        }

        p {
            color: #718096;
            font-size: 0.95em;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        a.btn {
            display: inline-block;
            padding: 16px 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 14px;
            font-size: 1.1em;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        a.btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        /*Адаптация для мобильных устройств*/
        @media (max-width: 480px) {
            body { padding: 15px; }

            .container, .login-container, .signup-box {
                padding: 30px 20px;
                border-radius: 20px;
            }

            h2 { font-size: 1.8em; }
            p.subtitle, p { font-size: 0.9em; }

            form input[type="text"],
            form input[type="password"],
            form input[type="email"],
            form input {
                padding: 12px;
                font-size: 16px;
            }

            button {
                padding: 14px;
                font-size: 1em;
            }

            .form-section { padding: 15px; }
        }

    </style>
{% endblock %}

{% block content %}
<div class="container">
    <h2>Готово!</h2>
    <p>Ваш пароль успешно изменён. Теперь можно войти с новым паролем.</p>
    <a href="{% url 'login' %}" class="btn">Войти в квест</a>
</div>
{% endblock %}
