{% extends 'base.html' %}

{% block title %}Редактировать награду | Family Quest{% endblock %}

{% block extra_styles %}
<style>
    body { align-items: center; } /* Выравниваем по центру */

    .edit-container {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        padding: 40px;
        border-radius: 24px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        width: 100%;
        max-width: 500px;
        animation: slideUp 0.5s ease;
    }

    h2 {
        text-align: center;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: 800;
        font-size: 2.2em;
        margin-bottom: 25px;
    }

    /* Стили формы */
    form p { margin-bottom: 15px; }
    form label { display: block; margin-bottom: 8px; font-weight: 600; color: #4a5568; font-size: 0.9em; }

    form input, form select, form textarea {
        width: 100%;
        padding: 14px;
        border: 1px solid #cbd5e0;
        border-radius: 12px;
        font-size: 1em;
        transition: all 0.3s ease;
        background: #f8fafc;
        font-family: inherit;
        box-sizing: border-box;
    }

    form textarea {
        resize: none;
        height: 100px;
    }

    form input:focus, form select:focus, form textarea:focus {
        outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); background: white;
    }

    /* Кнопки */
    .btn-save {
        width: 100%; padding: 16px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white; border: none; border-radius: 14px; font-size: 1.1em; font-weight: 700;
        cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        margin-top: 10px; margin-bottom: 15px;
    }
    .btn-save:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4); }

    .btn-cancel {
        display: block; text-align: center; text-decoration: none; color: #718096;
        font-weight: 600; padding: 12px; border-radius: 12px; border: 1px solid #e2e8f0;
        transition: all 0.3s ease;
    }
    .btn-cancel:hover { background: #f7fafc; color: #4a5568; }

    /* Адаптация */
    @media (max-width: 480px) {
        body { padding: 15px; }
        .edit-container { padding: 30px 20px; border-radius: 20px; }
        h2 { font-size: 1.8em; }
        .btn-save { padding: 14px; font-size: 1em; }
    }
</style>
{% endblock %}

{% block content %}
<div class="edit-container">
    <h2>🎁 Изменить награду</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn-save">💾 Сохранить изменения</button>
        <a href="{% url 'rewards_shop' %}" class="btn-cancel">Отмена</a>
    </form>
</div>
{% endblock %}
